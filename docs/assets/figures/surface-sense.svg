--><title id="title">Negative and positive surface sense</title><desc id="desc">Sphere: negative inside, positive outside. Plane x=0: negative to the left, positive along the normal.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#243447"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1080" height="420" rx="16" fill="#ffffff"/><text x="36" y="44" font-size="26" fill="#243447" text-anchor="start">Surface sense</text><text x="36" y="73" font-size="18" fill="#526578" text-anchor="start">A surface is the boundary; its sense selects a side.</text><rect x="28" y="96" width="500" height="300" rx="12" fill="#f3f6fa"/><rect x="548" y="96" width="504" height="300" rx="12" fill="#f3f6fa"/><text x="54" y="130" font-size="20" fill="#243447" text-anchor="start">Sphere · f = x² + y² + z² − r²</text><circle cx="208" cy="248" r="83" fill="#e1d4ef" stroke="#243447" stroke-width="2" /><text x="208" y="243" font-size="20" fill="#243447" text-anchor="middle">inside</text><text x="208" y="270" font-size="17" fill="#243447" text-anchor="middle">f &lt; 0  ·  sense −1</text><text x="344" y="219" font-size="20" fill="#243447" text-anchor="start">outside</text><text x="324" y="247" font-size="17" fill="#243447" text-anchor="start">f &gt; 0  ·  sense +1</text><text x="208" y="364" font-size="17" fill="#243447" text-anchor="middle">On the sphere: f = 0</text><text x="574" y="130" font-size="20" fill="#243447" text-anchor="start">Plane · f = x</text><rect x="578" y="161" width="206" height="166" rx="0" fill="#e1d4ef"/><rect x="784" y="161" width="238" height="166" rx="0" fill="#ffffff"/><path d="M784 150 L784 339" fill="none" stroke="#243447" stroke-width="2" /><path d="M784 186 L879 186" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/><text x="894" y="191" font-size="16" fill="#243447" text-anchor="start">normal</text><text x="682" y="253" font-size="22" fill="#243447" text-anchor="middle">x &lt; 0</text><text x="682" y="282" font-size="18" fill="#243447" text-anchor="middle">sense −1</text><text x="911" y="253" font-size="22" fill="#243447" text-anchor="middle">x &gt; 0</text><text x="911" y="282" font-size="18" fill="#243447" text-anchor="middle">sense +1</text><text x="784" y="364" font-size="17" fill="#243447" text-anchor="middle">On the plane: x = 0</text></g></svg>
