--><title id="title">Union, intersection, and difference</title><desc id="desc">Two overlapping circular regions A and B illustrate each Boolean operation.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#243447"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1080" height="425" rx="16" fill="#ffffff"/><text x="36" y="44" font-size="26" fill="#243447" text-anchor="start">Boolean operations</text><text x="36" y="73" font-size="18" fill="#526578" text-anchor="start">Colored areas show the resulting region. Dashed outlines retain the input shapes.</text><rect x="20" y="98" width="332" height="307" rx="12" fill="#f3f6fa"/><text x="186" y="135" font-size="21" fill="#243447" text-anchor="middle">Union</text><defs><clipPath id="clip0"><circle cx="235" cy="243" r="80" fill="white" stroke="none" stroke-width="2" /></clipPath><mask id="mask0"><rect x="20" y="150" width="332" height="185" rx="0" fill="white"/><circle cx="235" cy="243" r="80" fill="black" stroke="none" stroke-width="2" /></mask></defs><circle cx="159" cy="243" r="80" fill="#9467bd" stroke="none" stroke-width="2" /><circle cx="235" cy="243" r="80" fill="#9467bd" stroke="none" stroke-width="2" /><circle cx="159" cy="243" r="80" fill="none" stroke="#243447" stroke-width="2" stroke-dasharray="5 5"/><circle cx="235" cy="243" r="80" fill="none" stroke="#243447" stroke-width="2" stroke-dasharray="5 5"/><text x="124" y="250" font-size="22" fill="#243447" text-anchor="middle">A</text><text x="270" y="250" font-size="22" fill="#243447" text-anchor="middle">B</text><text x="186" y="355" font-size="23" fill="#243447" text-anchor="middle">A ∪ B</text><text x="186" y="383" font-size="17" fill="#243447" text-anchor="middle">Inside either region</text><rect x="374" y="98" width="332" height="307" rx="12" fill="#f3f6fa"/><text x="540" y="135" font-size="21" fill="#243447" text-anchor="middle">Intersection</text><defs><clipPath id="clip1"><circle cx="589" cy="243" r="80" fill="white" stroke="none" stroke-width="2" /></clipPath><mask id="mask1"><rect x="374" y="150" width="332" height="185" rx="0" fill="white"/><circle cx="589" cy="243" r="80" fill="black" stroke="none" stroke-width="2" /></mask></defs><circle cx="513" cy="243" r="80" fill="#9467bd" stroke="none" stroke-width="2" clip-path="url(#clip1)"/><circle cx="513" cy="243" r="80" fill="none" stroke="#243447" stroke-width="2" stroke-dasharray="5 5"/><circle cx="589" cy="243" r="80" fill="none" stroke="#243447" stroke-width="2" stroke-dasharray="5 5"/><text x="478" y="250" font-size="22" fill="#243447" text-anchor="middle">A</text><text x="624" y="250" font-size="22" fill="#243447" text-anchor="middle">B</text><text x="540" y="355" font-size="23" fill="#243447" text-anchor="middle">A ∩ B</text><text x="540" y="383" font-size="17" fill="#243447" text-anchor="middle">Inside both regions</text><rect x="728" y="98" width="332" height="307" rx="12" fill="#f3f6fa"/><text x="894" y="135" font-size="21" fill="#243447" text-anchor="middle">Difference</text><defs><clipPath id="clip2"><circle cx="943" cy="243" r="80" fill="white" stroke="none" stroke-width="2" /></clipPath><mask id="mask2"><rect x="728" y="150" width="332" height="185" rx="0" fill="white"/><circle cx="943" cy="243" r="80" fill="black" stroke="none" stroke-width="2" /></mask></defs><circle cx="867" cy="243" r="80" fill="#9467bd" stroke="none" stroke-width="2" mask="url(#mask2)"/><circle cx="867" cy="243" r="80" fill="none" stroke="#243447" stroke-width="2" stroke-dasharray="5 5"/><circle cx="943" cy="243" r="80" fill="none" stroke="#243447" stroke-width="2" stroke-dasharray="5 5"/><text x="832" y="250" font-size="22" fill="#243447" text-anchor="middle">A</text><text x="978" y="250" font-size="22" fill="#243447" text-anchor="middle">B</text><text x="894" y="355" font-size="23" fill="#243447" text-anchor="middle">A ∖ B</text><text x="894" y="383" font-size="17" fill="#243447" text-anchor="middle">Inside A, outside B</text></g></svg>
