<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="405" viewBox="0 0 1080 405" role="img" aria-labelledby="title desc"><!-- SPDX-FileCopyrightText: 2026 Giovanni MARIANO; SPDX-License-Identifier: MPL-2.0 --><title id="title">Ray intersections and cell segment lengths</title><desc id="desc">The ray starts in cell 1: t=0 to 3 cm. Cell 2 spans 3 to 7 cm; cell 3 spans 7 to 10 cm.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#243447"/></marker></defs><g font-family="Arial, Helvetica, sans-serif"><rect x="0" y="0" width="1080" height="405" rx="16" fill="#ffffff"/><text x="36" y="44" font-size="26" fill="#243447" text-anchor="start">Following a ray through the shield</text><text x="36" y="75" font-size="18" fill="#526578" text-anchor="start">One-dimensional view: origin at the center, unit direction +X, stop at the outer surface.</text><rect x="95" y="122" width="264" height="159" rx="0" fill="#ff7f0e"/><text x="227.0" y="152" font-size="20" fill="#14212f" text-anchor="middle">Source region</text><text x="227.0" y="179" font-size="17" fill="#14212f" text-anchor="middle">Cell 1 · material 1</text><text x="227.0" y="262" font-size="22" fill="#14212f" text-anchor="middle">3 cm</text><rect x="359" y="122" width="352" height="159" rx="0" fill="#2ca02c"/><text x="535.0" y="152" font-size="20" fill="#14212f" text-anchor="middle">Inner shield</text><text x="535.0" y="179" font-size="17" fill="#14212f" text-anchor="middle">Cell 2 · material 2</text><text x="535.0" y="262" font-size="22" fill="#14212f" text-anchor="middle">4 cm</text><rect x="711" y="122" width="264" height="159" rx="0" fill="#9467bd"/><text x="843.0" y="152" font-size="20" fill="#14212f" text-anchor="middle">Outer shield</text><text x="843.0" y="179" font-size="17" fill="#14212f" text-anchor="middle">Cell 3 · material 4</text><text x="843.0" y="262" font-size="22" fill="#14212f" text-anchor="middle">3 cm</text><path d="M95 210 L1010 210" fill="none" stroke="#243447" stroke-width="2" marker-end="url(#arrow)"/><circle cx="95" cy="210" r="5" fill="#ffffff" stroke="#243447" stroke-width="2" /><path d="M95 286 L95 298" fill="none" stroke="#243447" stroke-width="2" /><text x="95" y="325" font-size="18" fill="#243447" text-anchor="middle">t = 0</text><circle cx="359" cy="210" r="5" fill="#ffffff" stroke="#243447" stroke-width="2" /><path d="M359 286 L359 298" fill="none" stroke="#243447" stroke-width="2" /><text x="359" y="325" font-size="18" fill="#243447" text-anchor="middle">t = 3</text><circle cx="711" cy="210" r="5" fill="#ffffff" stroke="#243447" stroke-width="2" /><path d="M711 286 L711 298" fill="none" stroke="#243447" stroke-width="2" /><text x="711" y="325" font-size="18" fill="#243447" text-anchor="middle">t = 7</text><circle cx="975" cy="210" r="5" fill="#ffffff" stroke="#243447" stroke-width="2" /><path d="M975 286 L975 298" fill="none" stroke="#243447" stroke-width="2" /><text x="975" y="325" font-size="18" fill="#243447" text-anchor="middle">t = 10</text><text x="540" y="371" font-size="19" fill="#243447" text-anchor="middle">Segment length = t_exit − t_enter   •   t is in cm for this unit direction</text></g></svg>
