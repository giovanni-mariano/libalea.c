name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build release
        run: make full cli tools RELEASE=1

      - name: Run tests
        run: make test-unit test-integration test-lua

      - name: Package
        run: |
          mkdir -p dist/alea-linux-x64
          cp bin/alea dist/alea-linux-x64/
          cp bin/mc_convert dist/alea-linux-x64/
          cp bin/mc_plotter dist/alea-linux-x64/
          cp bin/nuc_plot dist/alea-linux-x64/
          cp bin/nuc_inventory dist/alea-linux-x64/
          cp bin/large_model_probe dist/alea-linux-x64/
          cp bin/*.a dist/alea-linux-x64/
          cp -r include dist/alea-linux-x64/
          cp README.md LICENSE* dist/alea-linux-x64/ 2>/dev/null || true
          cd dist && tar -czvf alea-linux-x64.tar.gz alea-linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: alea-linux-x64
          path: dist/alea-linux-x64.tar.gz

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build release
        run: make full cli tools RELEASE=1

      - name: Run tests
        run: make test-unit test-integration test-lua

      - name: Package
        run: |
          mkdir -p dist/alea-linux-arm64
          cp bin/alea dist/alea-linux-arm64/
          cp bin/mc_convert dist/alea-linux-arm64/
          cp bin/mc_plotter dist/alea-linux-arm64/
          cp bin/nuc_plot dist/alea-linux-arm64/
          cp bin/nuc_inventory dist/alea-linux-arm64/
          cp bin/large_model_probe dist/alea-linux-arm64/
          cp bin/*.a dist/alea-linux-arm64/
          cp -r include dist/alea-linux-arm64/
          cp README.md LICENSE* dist/alea-linux-arm64/ 2>/dev/null || true
          cd dist && tar -czvf alea-linux-arm64.tar.gz alea-linux-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: alea-linux-arm64
          path: dist/alea-linux-arm64.tar.gz

  build-macos-x64:
    runs-on: macos-15-intel  # Intel runner (replaces retired macos-13)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build release
        run: make full cli tools RELEASE=1 CFLAGS="-Wall -Wextra -O3 -DNDEBUG -std=c11 -fPIC"

      - name: Run tests
        run: make test-unit test-integration test-lua

      - name: Package
        run: |
          mkdir -p dist/alea-macos-x64
          cp bin/alea dist/alea-macos-x64/
          cp bin/mc_convert dist/alea-macos-x64/
          cp bin/mc_plotter dist/alea-macos-x64/
          cp bin/nuc_plot dist/alea-macos-x64/
          cp bin/nuc_inventory dist/alea-macos-x64/
          cp bin/large_model_probe dist/alea-macos-x64/
          cp bin/*.a dist/alea-macos-x64/
          cp -r include dist/alea-macos-x64/
          cp README.md LICENSE* dist/alea-macos-x64/ 2>/dev/null || true
          cd dist && tar -czvf alea-macos-x64.tar.gz alea-macos-x64

      - uses: actions/upload-artifact@v7
        with:
          name: alea-macos-x64
          path: dist/alea-macos-x64.tar.gz

  build-macos-arm64:
    runs-on: macos-latest  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build release
        run: make full cli tools RELEASE=1 CFLAGS="-Wall -Wextra -O3 -DNDEBUG -std=c11 -fPIC"

      - name: Run tests
        run: make test-unit test-integration test-lua

      - name: Package
        run: |
          mkdir -p dist/alea-macos-arm64
          cp bin/alea dist/alea-macos-arm64/
          cp bin/mc_convert dist/alea-macos-arm64/
          cp bin/mc_plotter dist/alea-macos-arm64/
          cp bin/nuc_plot dist/alea-macos-arm64/
          cp bin/nuc_inventory dist/alea-macos-arm64/
          cp bin/large_model_probe dist/alea-macos-arm64/
          cp bin/*.a dist/alea-macos-arm64/
          cp -r include dist/alea-macos-arm64/
          cp README.md LICENSE* dist/alea-macos-arm64/ 2>/dev/null || true
          cd dist && tar -czvf alea-macos-arm64.tar.gz alea-macos-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: alea-macos-arm64
          path: dist/alea-macos-arm64.tar.gz

  build-windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            make
            zip

      - name: Build release
        run: make full cli tools RELEASE=1 PORTABLE=1 USE_TINYPAR=1

      - name: Run tests
        run: make test-unit test-integration RELEASE=1 PORTABLE=1 USE_TINYPAR=1

      - name: Package
        run: |
          mkdir -p dist/alea-windows-x64
          cp bin/alea.exe dist/alea-windows-x64/ 2>/dev/null || cp bin/alea dist/alea-windows-x64/alea.exe
          cp bin/mc_convert.exe dist/alea-windows-x64/ 2>/dev/null || cp bin/mc_convert dist/alea-windows-x64/mc_convert.exe
          cp bin/mc_plotter.exe dist/alea-windows-x64/ 2>/dev/null || cp bin/mc_plotter dist/alea-windows-x64/mc_plotter.exe
          cp bin/nuc_plot.exe dist/alea-windows-x64/ 2>/dev/null || cp bin/nuc_plot dist/alea-windows-x64/nuc_plot.exe
          cp bin/nuc_inventory.exe dist/alea-windows-x64/ 2>/dev/null || cp bin/nuc_inventory dist/alea-windows-x64/nuc_inventory.exe
          cp bin/large_model_probe.exe dist/alea-windows-x64/ 2>/dev/null || cp bin/large_model_probe dist/alea-windows-x64/large_model_probe.exe
          cp bin/*.a dist/alea-windows-x64/
          cp -r include dist/alea-windows-x64/
          cp README.md LICENSE* dist/alea-windows-x64/ 2>/dev/null || true
          cd dist && zip -r alea-windows-x64.zip alea-windows-x64

      - uses: actions/upload-artifact@v7
        with:
          name: alea-windows-x64
          path: dist/alea-windows-x64.zip

  build-windows-msvc-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build release
        shell: pwsh
        run: ./build-msvc.ps1 RELEASE=1 full

      - name: Run tests
        shell: pwsh
        run: ./build-msvc.ps1 RELEASE=1 test

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/alea-windows-msvc-x64 | Out-Null
          Copy-Item bin/*.lib dist/alea-windows-msvc-x64/
          Copy-Item include dist/alea-windows-msvc-x64/include -Recurse
          Copy-Item README.md dist/alea-windows-msvc-x64/
          Copy-Item LICENSES dist/alea-windows-msvc-x64/LICENSES -Recurse
          Compress-Archive -Path dist/alea-windows-msvc-x64 -DestinationPath dist/alea-windows-msvc-x64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: alea-windows-msvc-x64
          path: dist/alea-windows-msvc-x64.zip

  build-pyalea-linux:
    name: pyAlea Linux ${{ matrix.arch }} cp${{ matrix.python-abi }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: ubuntu-24.04, image: quay.io/pypa/manylinux_2_28_x86_64, python-abi: "310", numpy: "2.0.2"}
          - {arch: x86_64, runner: ubuntu-24.04, image: quay.io/pypa/manylinux_2_28_x86_64, python-abi: "311", numpy: "2.0.2"}
          - {arch: x86_64, runner: ubuntu-24.04, image: quay.io/pypa/manylinux_2_28_x86_64, python-abi: "312", numpy: "2.0.2"}
          - {arch: x86_64, runner: ubuntu-24.04, image: quay.io/pypa/manylinux_2_28_x86_64, python-abi: "313", numpy: "2.1.3"}
          - {arch: x86_64, runner: ubuntu-24.04, image: quay.io/pypa/manylinux_2_28_x86_64, python-abi: "314", numpy: "2.3.3"}
          - {arch: aarch64, runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64, python-abi: "310", numpy: "2.0.2"}
          - {arch: aarch64, runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64, python-abi: "311", numpy: "2.0.2"}
          - {arch: aarch64, runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64, python-abi: "312", numpy: "2.0.2"}
          - {arch: aarch64, runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64, python-abi: "313", numpy: "2.1.3"}
          - {arch: aarch64, runner: ubuntu-24.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64, python-abi: "314", numpy: "2.3.3"}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build and test in manylinux_2_28
        run: |
          docker run --rm \
            -v "$PWD:/project" \
            -w /project \
            "${{ matrix.image }}" \
            bash -c 'set -e; \
              git config --global --add safe.directory /project; \
              python_bin=/opt/python/cp${{ matrix.python-abi }}-cp${{ matrix.python-abi }}/bin/python; \
              "$python_bin" -m pip install "numpy==${{ matrix.numpy }}" pytest; \
              make -C bindings/python package \
                PYTHON="$python_bin" PLATFORM_TAG=manylinux_2_28_${{ matrix.arch }}; \
              if [ "${{ matrix.python-abi }}" -le 312 ]; then \
                "$python_bin" -m pip install --force-reinstall "numpy==1.26.4"; \
                make -C bindings/python test-runtime \
                  PYTHON="$python_bin" PLATFORM_TAG=manylinux_2_28_${{ matrix.arch }}; \
              fi; \
              "$python_bin" -m pip install --upgrade --force-reinstall "numpy>=2,<3"; \
              make -C bindings/python test-runtime \
                PYTHON="$python_bin" PLATFORM_TAG=manylinux_2_28_${{ matrix.arch }}'

      - uses: actions/upload-artifact@v7
        with:
          name: pyalea-linux-${{ matrix.arch }}-cp${{ matrix.python-abi }}
          path: bindings/python/dist/*
          if-no-files-found: error

  build-pyalea-macos:
    name: pyAlea ${{ matrix.os }} Python ${{ matrix.python.version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python:
          - {version: "3.10", numpy: "2.0.2", numpy1: true}
          - {version: "3.11", numpy: "2.0.2", numpy1: true}
          - {version: "3.12", numpy: "2.0.2", numpy1: true}
          - {version: "3.13", numpy: "2.1.3", numpy1: false}
          - {version: "3.14", numpy: "2.3.3", numpy1: false}
        os: [macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python.version }}

      - name: Install binding build dependency
        run: python -m pip install "numpy==${{ matrix.python.numpy }}" pytest

      - name: Build, test, and package pyAlea
        run: make -C bindings/python package PYTHON=python3

      - name: Test existing binary with NumPy 1.26.4
        if: matrix.python.numpy1
        run: |
          python -m pip install --force-reinstall "numpy==1.26.4"
          make -C bindings/python test-runtime PYTHON=python3

      - name: Test existing binary with latest compatible NumPy 2.x
        run: |
          python -m pip install --upgrade --force-reinstall "numpy>=2,<3"
          make -C bindings/python test-runtime PYTHON=python3

      - uses: actions/upload-artifact@v7
        with:
          name: pyalea-${{ matrix.os }}-cp${{ matrix.python.version }}
          path: bindings/python/dist/*
          if-no-files-found: error

  build-pyalea-windows:
    name: pyAlea Windows x64 Python ${{ matrix.python.version }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python:
          - {version: "3.10", numpy: "2.0.2", numpy1: true}
          - {version: "3.11", numpy: "2.0.2", numpy1: true}
          - {version: "3.12", numpy: "2.0.2", numpy1: true}
          - {version: "3.13", numpy: "2.1.3", numpy1: false}
          - {version: "3.14", numpy: "2.3.3", numpy1: false}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python.version }}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install binding build dependency
        run: python -m pip install "numpy==${{ matrix.python.numpy }}" pytest

      - name: Build, test, and package pyAlea
        working-directory: bindings/python
        run: nmake /nologo /f Makefile.msvc PYTHON=python package

      - name: Test existing binary with NumPy 1.26.4
        if: matrix.python.numpy1
        working-directory: bindings/python
        run: |
          python -m pip install --force-reinstall "numpy==1.26.4"
          nmake /nologo /f Makefile.msvc PYTHON=python test-runtime

      - name: Test existing binary with latest compatible NumPy 2.x
        working-directory: bindings/python
        run: |
          python -m pip install --upgrade --force-reinstall "numpy>=2,<3"
          nmake /nologo /f Makefile.msvc PYTHON=python test-runtime

      - uses: actions/upload-artifact@v7
        with:
          name: pyalea-windows-x64-cp${{ matrix.python.version }}
          path: bindings/python/dist/*
          if-no-files-found: error

  create-release:
    needs: [build-linux-x64, build-linux-arm64, build-macos-x64, build-macos-arm64, build-windows-x64, build-windows-msvc-x64, build-pyalea-linux, build-pyalea-macos, build-pyalea-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Build pyAlea asset manifest
        run: python bindings/python/scripts/release_manifest.py artifacts pyalea-manifest.json

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/alea-linux-x64/alea-linux-x64.tar.gz
            artifacts/alea-linux-arm64/alea-linux-arm64.tar.gz
            artifacts/alea-macos-x64/alea-macos-x64.tar.gz
            artifacts/alea-macos-arm64/alea-macos-arm64.tar.gz
            artifacts/alea-windows-x64/alea-windows-x64.zip
            artifacts/alea-windows-msvc-x64/alea-windows-msvc-x64.zip
            artifacts/pyalea-*/*
            pyalea-manifest.json
