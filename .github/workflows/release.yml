name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build release
        run: make full cli tools RELEASE=1

      - name: Run tests
        run: make test-unit test-integration test-lua

      - name: Package
        run: |
          mkdir -p dist/alea-linux-x64
          cp bin/alea dist/alea-linux-x64/
          cp bin/mc_convert dist/alea-linux-x64/
          cp bin/mc_plotter dist/alea-linux-x64/
          cp bin/nuc_plot dist/alea-linux-x64/
          cp bin/large_model_probe dist/alea-linux-x64/
          cp bin/*.a dist/alea-linux-x64/
          cp -r include dist/alea-linux-x64/
          cp README.md LICENSE* dist/alea-linux-x64/ 2>/dev/null || true
          cd dist && tar -czvf alea-linux-x64.tar.gz alea-linux-x64

      - uses: actions/upload-artifact@v7
        with:
          name: alea-linux-x64
          path: dist/alea-linux-x64.tar.gz

  build-linux-conda-openmp-x64:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: libalea-linux-openmp
          auto-activate: false
          channel-priority: strict
          channels: conda-forge

      - name: Install conda clang toolchain + OpenMP
        run: |
          conda install -y clang llvm-openmp make
          clang --version

      - name: Build release
        run: make full cli tools RELEASE=1 USE_OPENMP=1 CC=clang LIBOMP_PREFIX="$CONDA_PREFIX"

      - name: Run tests
        run: make test-unit test-integration test-lua RELEASE=1 USE_OPENMP=1 CC=clang LIBOMP_PREFIX="$CONDA_PREFIX"

      - name: Package
        run: |
          mkdir -p dist/alea-linux-conda-openmp-x64
          cp bin/alea dist/alea-linux-conda-openmp-x64/
          cp bin/mc_convert dist/alea-linux-conda-openmp-x64/
          cp bin/mc_plotter dist/alea-linux-conda-openmp-x64/
          cp bin/nuc_plot dist/alea-linux-conda-openmp-x64/
          cp bin/large_model_probe dist/alea-linux-conda-openmp-x64/
          cp bin/*.a dist/alea-linux-conda-openmp-x64/
          cp -r include dist/alea-linux-conda-openmp-x64/
          cp README.md LICENSE* dist/alea-linux-conda-openmp-x64/ 2>/dev/null || true
          printf '%s\n' \
            '# Linux OpenMP Runtime Requirement' \
            '' \
            'This package contains static libraries and executables built with' \
            'conda-forge clang and LLVM OpenMP.' \
            '' \
            'Applications linked against these OpenMP-enabled libraries require' \
            'the LLVM OpenMP runtime at run time:' \
            '' \
            '    conda install -c conda-forge llvm-openmp' \
            '' \
            'This runtime requirement does not require compiler tools. Those are' \
            'needed only when compiling or linking applications, not when running' \
            'an already-built executable.' \
            '' \
            'If an executable cannot find libomp.so, run it from an activated conda' \
            "environment or ensure the conda environment's lib directory is on the" \
            'runtime library search path.' \
            > dist/alea-linux-conda-openmp-x64/OPENMP_RUNTIME.md
          printf '%s\n' \
            'libalea Linux conda OpenMP build' \
            'compiler: conda-forge clang' \
            'OpenMP: LLVM OpenMP' \
            'runtime dependency: conda install -c conda-forge llvm-openmp' \
            'runtime libraries bundled: no' \
            > dist/alea-linux-conda-openmp-x64/BUILD_INFO.txt
          cd dist && tar -czvf alea-linux-conda-openmp-x64.tar.gz alea-linux-conda-openmp-x64

      - uses: actions/upload-artifact@v7
        with:
          name: alea-linux-conda-openmp-x64
          path: dist/alea-linux-conda-openmp-x64.tar.gz

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build release
        run: make full cli tools RELEASE=1

      - name: Run tests
        run: make test-unit test-integration test-lua

      - name: Package
        run: |
          mkdir -p dist/alea-linux-arm64
          cp bin/alea dist/alea-linux-arm64/
          cp bin/mc_convert dist/alea-linux-arm64/
          cp bin/mc_plotter dist/alea-linux-arm64/
          cp bin/nuc_plot dist/alea-linux-arm64/
          cp bin/large_model_probe dist/alea-linux-arm64/
          cp bin/*.a dist/alea-linux-arm64/
          cp -r include dist/alea-linux-arm64/
          cp README.md LICENSE* dist/alea-linux-arm64/ 2>/dev/null || true
          cd dist && tar -czvf alea-linux-arm64.tar.gz alea-linux-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: alea-linux-arm64
          path: dist/alea-linux-arm64.tar.gz

  build-macos-x64:
    runs-on: macos-15-intel  # Intel runner (replaces retired macos-13)
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build release
        run: make full cli tools RELEASE=1 CFLAGS="-Wall -Wextra -O3 -DNDEBUG -std=c11 -fPIC"

      - name: Run tests
        run: make test-unit test-integration test-lua

      - name: Package
        run: |
          mkdir -p dist/alea-macos-x64
          cp bin/alea dist/alea-macos-x64/
          cp bin/mc_convert dist/alea-macos-x64/
          cp bin/mc_plotter dist/alea-macos-x64/
          cp bin/nuc_plot dist/alea-macos-x64/
          cp bin/large_model_probe dist/alea-macos-x64/
          cp bin/*.a dist/alea-macos-x64/
          cp -r include dist/alea-macos-x64/
          cp README.md LICENSE* dist/alea-macos-x64/ 2>/dev/null || true
          cd dist && tar -czvf alea-macos-x64.tar.gz alea-macos-x64

      - uses: actions/upload-artifact@v7
        with:
          name: alea-macos-x64
          path: dist/alea-macos-x64.tar.gz

  build-macos-arm64:
    runs-on: macos-latest  # Apple Silicon runner
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build release
        run: make full cli tools RELEASE=1 CFLAGS="-Wall -Wextra -O3 -DNDEBUG -std=c11 -fPIC"

      - name: Run tests
        run: make test-unit test-integration test-lua

      - name: Package
        run: |
          mkdir -p dist/alea-macos-arm64
          cp bin/alea dist/alea-macos-arm64/
          cp bin/mc_convert dist/alea-macos-arm64/
          cp bin/mc_plotter dist/alea-macos-arm64/
          cp bin/nuc_plot dist/alea-macos-arm64/
          cp bin/large_model_probe dist/alea-macos-arm64/
          cp bin/*.a dist/alea-macos-arm64/
          cp -r include dist/alea-macos-arm64/
          cp README.md LICENSE* dist/alea-macos-arm64/ 2>/dev/null || true
          cd dist && tar -czvf alea-macos-arm64.tar.gz alea-macos-arm64

      - uses: actions/upload-artifact@v7
        with:
          name: alea-macos-arm64
          path: dist/alea-macos-arm64.tar.gz

  build-windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            make
            zip

      - name: Build release
        run: make full cli tools RELEASE=1 CFLAGS="-Wall -Wextra -O3 -DNDEBUG -std=c11"

      - name: Run tests
        run: make test-unit test-integration

      - name: Package
        run: |
          mkdir -p dist/alea-windows-x64
          cp bin/alea.exe dist/alea-windows-x64/ 2>/dev/null || cp bin/alea dist/alea-windows-x64/alea.exe
          cp bin/mc_convert.exe dist/alea-windows-x64/ 2>/dev/null || cp bin/mc_convert dist/alea-windows-x64/mc_convert.exe
          cp bin/mc_plotter.exe dist/alea-windows-x64/ 2>/dev/null || cp bin/mc_plotter dist/alea-windows-x64/mc_plotter.exe
          cp bin/nuc_plot.exe dist/alea-windows-x64/ 2>/dev/null || cp bin/nuc_plot dist/alea-windows-x64/nuc_plot.exe
          cp bin/large_model_probe.exe dist/alea-windows-x64/ 2>/dev/null || cp bin/large_model_probe dist/alea-windows-x64/large_model_probe.exe
          cp bin/*.a dist/alea-windows-x64/
          cp -r include dist/alea-windows-x64/
          cp README.md LICENSE* dist/alea-windows-x64/ 2>/dev/null || true
          cd dist && zip -r alea-windows-x64.zip alea-windows-x64

      - uses: actions/upload-artifact@v7
        with:
          name: alea-windows-x64
          path: dist/alea-windows-x64.zip

  build-windows-msvc-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build release
        shell: pwsh
        run: ./build-msvc.ps1 RELEASE=1 full

      - name: Run tests
        shell: pwsh
        run: ./build-msvc.ps1 RELEASE=1 test

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/alea-windows-msvc-x64 | Out-Null
          Copy-Item bin/*.lib dist/alea-windows-msvc-x64/
          Copy-Item include dist/alea-windows-msvc-x64/include -Recurse
          Copy-Item README.md dist/alea-windows-msvc-x64/
          Copy-Item LICENSES dist/alea-windows-msvc-x64/LICENSES -Recurse
          Compress-Archive -Path dist/alea-windows-msvc-x64 -DestinationPath dist/alea-windows-msvc-x64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: alea-windows-msvc-x64
          path: dist/alea-windows-msvc-x64.zip

  build-windows-msvc-openmp-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: libalea-clang-openmp
          auto-activate: false
          channel-priority: strict
          channels: conda-forge

      - name: Install conda clang-cl toolchain + OpenMP + jom
        shell: pwsh
        run: |
          conda install -y clang_win-64 llvm-openmp jom
          where.exe clang-cl
          where.exe llvm-lib
          where.exe jom

      - name: Build release
        shell: pwsh
        run: jom /J 1 /f Makefile.msvc CONDA_CLANG=1 USE_OPENMP=1 RELEASE=1 full

      - name: Run tests
        shell: pwsh
        run: jom /J 1 /f Makefile.msvc CONDA_CLANG=1 USE_OPENMP=1 RELEASE=1 test

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/alea-windows-msvc-openmp-x64 | Out-Null
          Copy-Item bin/*.lib dist/alea-windows-msvc-openmp-x64/
          Copy-Item include dist/alea-windows-msvc-openmp-x64/include -Recurse
          Copy-Item README.md dist/alea-windows-msvc-openmp-x64/
          Copy-Item LICENSES dist/alea-windows-msvc-openmp-x64/LICENSES -Recurse
          @(
            '# Windows OpenMP Runtime Requirement'
            ''
            'This package contains MSVC-ABI static libraries built with conda'
            'clang-cl and LLVM OpenMP.'
            ''
            'Applications linked against these OpenMP-enabled libraries require'
            'the LLVM OpenMP runtime at run time:'
            ''
            '    conda install -c conda-forge llvm-openmp'
            ''
            'This runtime requirement does not require Visual Studio, Windows SDK'
            'headers, or compiler tools. Those are needed only when compiling or'
            'linking applications, not when running an already-built executable.'
            ''
            'When compiling an application against these libraries, use an'
            'MSVC-ABI-compatible toolchain and link with LLVM OpenMP support, for'
            'example clang-cl with /openmp:llvm. Windows SDK/MSVC headers and'
            'import libraries must be visible at build time.'
          ) | Set-Content -Encoding UTF8 dist/alea-windows-msvc-openmp-x64/OPENMP_RUNTIME.md
          @(
            'libalea Windows MSVC OpenMP build'
            'compiler: conda-forge clang_win-64 clang-cl'
            'archive tool: llvm-lib'
            'OpenMP: LLVM OpenMP, enabled with /openmp:llvm'
            'runtime dependency: conda install -c conda-forge llvm-openmp'
            'runtime DLLs bundled: no'
            'ABI: MSVC x64'
            'CRT: dynamic (/MD)'
          ) | Set-Content -Encoding UTF8 dist/alea-windows-msvc-openmp-x64/BUILD_INFO.txt
          Compress-Archive -Path dist/alea-windows-msvc-openmp-x64 -DestinationPath dist/alea-windows-msvc-openmp-x64.zip -Force

      - uses: actions/upload-artifact@v7
        with:
          name: alea-windows-msvc-openmp-x64
          path: dist/alea-windows-msvc-openmp-x64.zip

  create-release:
    needs: [build-linux-x64, build-linux-conda-openmp-x64, build-linux-arm64, build-macos-x64, build-macos-arm64, build-windows-x64, build-windows-msvc-x64, build-windows-msvc-openmp-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            artifacts/alea-linux-x64/alea-linux-x64.tar.gz
            artifacts/alea-linux-conda-openmp-x64/alea-linux-conda-openmp-x64.tar.gz
            artifacts/alea-linux-arm64/alea-linux-arm64.tar.gz
            artifacts/alea-macos-x64/alea-macos-x64.tar.gz
            artifacts/alea-macos-arm64/alea-macos-arm64.tar.gz
            artifacts/alea-windows-x64/alea-windows-x64.zip
            artifacts/alea-windows-msvc-x64/alea-windows-msvc-x64.zip
            artifacts/alea-windows-msvc-openmp-x64/alea-windows-msvc-openmp-x64.zip
