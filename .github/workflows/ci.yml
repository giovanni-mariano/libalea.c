name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y valgrind libomp-dev

      - name: Build (debug)
        run: make full cli tools CC=${{ matrix.compiler }} USE_OPENMP=1

      - name: Run unit tests
        run: make test-unit CC=${{ matrix.compiler }} USE_OPENMP=1

      - name: Run integration tests
        run: make test-integration CC=${{ matrix.compiler }} USE_OPENMP=1

      - name: Run Lua tests
        run: make test-lua CC=${{ matrix.compiler }} USE_OPENMP=1

      - name: Valgrind check (gcc only)
        if: matrix.compiler == 'gcc'
        run: make test-valgrind CC=${{ matrix.compiler }} USE_OPENMP=1

      - name: Build (release)
        run: make clean && make full cli tools RELEASE=1 CC=${{ matrix.compiler }} USE_OPENMP=1

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install OpenMP
        run: brew install libomp

      - name: Build
        run: make full cli tools USE_OPENMP=1

      - name: Run tests
        run: make test-unit test-integration test-lua USE_OPENMP=1

      - name: Build (release)
        run: make clean && make full cli tools RELEASE=1 USE_OPENMP=1

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make
            mingw-w64-ucrt-x86_64-omp
            make

      - name: Build
        run: make full cli tools USE_OPENMP=1

      - name: Run tests
        run: make test-unit test-integration USE_OPENMP=1

  build-windows-msvc:
    # MSVC migration (docs/MSVC_MIGRATION_PLAN.md). Phases 1-2-5 are done
    # (atomics shim, thread-local, POSIX compat sweep). This is the first build
    # on a real cl.exe toolchain, so MSVC-specific warnings/quirks may still need
    # triage. Kept non-blocking so it tracks progress without gating PRs — flip
    # continue-on-error off once it is reliably green.
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC environment (vcvars64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build static libraries (MSVC)
        run: nmake /f Makefile.msvc full

      - name: Run unit & integration tests (MSVC)
        run: nmake /f Makefile.msvc test

  reuse-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: REUSE compliance check
        uses: fsfe/reuse-action@v4
